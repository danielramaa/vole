[package]
name = "vole"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
ratatui = "0.30.2"
rustix = { version = "1.1.5", features = ["fs", "param", "process", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
toml = "1.1.6"
